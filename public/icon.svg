<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0005;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#0a0a0a" stroke="url(#shieldGrad)" stroke-width="4"/>

  <!-- Shield shape -->
  <path d="M128 30 L210 70 L210 140 Q210 200 128 230 Q46 200 46 140 L46 70 Z"
        fill="url(#innerGrad)" stroke="url(#shieldGrad)" stroke-width="3"/>

  <!-- Shield inner border -->
  <path d="M128 42 L200 78 L200 140 Q200 192 128 218 Q56 192 56 140 L56 78 Z"
        fill="none" stroke="#DC143C" stroke-width="1" opacity="0.4"/>

  <!-- Crosshair - horizontal line -->
  <line x1="70" y1="130" x2="186" y2="130" stroke="#DC143C" stroke-width="1.5" opacity="0.7"/>
  <!-- Crosshair - vertical line -->
  <line x1="128" y1="74" x2="128" y2="186" stroke="#DC143C" stroke-width="1.5" opacity="0.7"/>

  <!-- Crosshair center rings -->
  <circle cx="128" cy="130" r="30" fill="none" stroke="#DC143C" stroke-width="1.5" opacity="0.6"/>
  <circle cx="128" cy="130" r="16" fill="none" stroke="#DC143C" stroke-width="1.5" opacity="0.8"/>

  <!-- Center dot -->
  <circle cx="128" cy="130" r="4" fill="#DC143C" filter="url(#glow)"/>

  <!-- Corner tick marks -->
  <line x1="90" y1="100" x2="100" y2="100" stroke="#DC143C" stroke-width="1" opacity="0.5"/>
  <line x1="90" y1="100" x2="90" y2="110" stroke="#DC143C" stroke-width="1" opacity="0.5"/>
  <line x1="166" y1="100" x2="156" y2="100" stroke="#DC143C" stroke-width="1" opacity="0.5"/>
  <line x1="166" y1="100" x2="166" y2="110" stroke="#DC143C" stroke-width="1" opacity="0.5"/>
  <line x1="90" y1="160" x2="100" y2="160" stroke="#DC143C" stroke-width="1" opacity="0.5"/>
  <line x1="90" y1="160" x2="90" y2="150" stroke="#DC143C" stroke-width="1" opacity="0.5"/>
  <line x1="166" y1="160" x2="156" y2="160" stroke="#DC143C" stroke-width="1" opacity="0.5"/>
  <line x1="166" y1="160" x2="166" y2="150" stroke="#DC143C" stroke-width="1" opacity="0.5"/>

  <!-- Text -->
  <text x="128" y="210" text-anchor="middle" fill="#DC143C" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="3" opacity="0.8">SENTINEL</text>
</svg>
