# Crimson Sentinel — Infra local (A5)
# Só Redis hoje — BullMQ/ioredis conectam aqui.
# Uso:
#   docker compose up -d            # sobe Redis em background
#   docker compose logs -f redis    # acompanha logs
#   docker compose down             # para e remove o container
#
# Persistência: volume nomeado "redis-data" sobrevive a restarts do compose.
# Porta 6379 exposta no host — a API/workers conectam em redis://127.0.0.1:6379.

services:
  redis:
    image: redis:7-alpine
    container_name: crimson-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
    driver: local
